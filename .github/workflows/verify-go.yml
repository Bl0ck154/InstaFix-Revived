name: Verify Go build and self-hosting

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/verify-go.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Go unit tests
        run: go test ./...
      - name: Go build
        run: go build ./...
      - name: Validate Compose example
        run: docker compose -f docker-compose.example.yml config --quiet
      - name: Docker image build
        run: docker build -t instafix-revived:verify .
