services:
  instafix:
    build: .
    image: instafix-revived:local
    restart: unless-stopped
    # Bind locally; use an HTTPS reverse proxy to expose your own hostname.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Default self-hosted stateless preview mode.
      # Set this to your public HTTPS origin when deploying behind a reverse proxy.
      INSTAFIX_PUBLIC_BASE_URL: ${INSTAFIX_PUBLIC_BASE_URL:-http://localhost:3000}
      INSTAFIX_EXPERIMENT_MODE: stateless_cloudrun
      INSTAFIX_EXPERIMENT_LABEL: self-hosted
      INSTAFIX_PUBLIC_VIDEO_REFRESH_DIRECT: "true"
      MAX_INLINE_VIDEO_BYTES: "20971520"
      INSTAFIX_STATELESS_EDGE_TTL_SECONDS: "300"
      INSTAFIX_STATELESS_CDN_EXPIRY_MARGIN_SECONDS: "1800"
      # Optional operational Telegram report:
      # TELEGRAM_BOT_TOKEN: ""
      # TELEGRAM_CHAT_ID: ""
      # DAILY_REPORT_HOUR_UTC: "0"
      # REPORT_ADMIN_TOKEN: ""

  # Optional legacy authenticated fallback. Not started by default.
  # Enable explicitly with: docker compose -f docker-compose.example.yml --profile auth-helper up -d
  # Create ./secrets/instagram_cookie yourself before enabling this profile.
  # Never expose the helper publicly; it can access session cookies.
  auth-helper:
    profiles: ["auth-helper"]
    build: ./auth-helper
    image: instafix-auth-helper:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"
    environment:
      AUTH_HELPER_LISTEN: 0.0.0.0:3200
      AUTH_HELPER_MAX_PER_MINUTE: "20"
      AUTH_HELPER_AUTH_MAX_PER_MINUTE: "6"
      AUTH_HELPER_ENABLE_VIDEO_PROXY: "false"
    volumes:
      - ./secrets/instagram_cookie:/run/secrets/instagram_cookie:ro
